<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 448" role="img" aria-label="JSS The Print Zone">
  <!--
    JSS mark: three rising sails and the dot, redrawn as vectors so it stays
    crisp at 20px in the sidebar and on a print stylesheet.

    Each sail is one closed path: an outer edge bowing right from the tip, a
    rounded base sweeping left, and an inner edge bowing left back up to the
    tip. The gap between the outer and inner curves is what gives the shape its
    weight — thin control points make it read as a blade of grass rather than a
    sail.

    This is a REDRAWN approximation, not the original artwork. If you have the
    real vector file, replace this file with it — nothing else needs to change,
    every usage points at /jss-logo.svg.
  -->
  <ellipse cx="150" cy="318" rx="84" ry="58" fill="#00A0DE" />

  <path
    d="M265 98 C303 192 316 286 298 346 C290 374 255 386 229 365 C240 300 249 196 265 98 Z"
    fill="#00A0DE"
  />
  <path
    d="M333 68 C373 170 387 278 368 344 C359 373 323 386 296 364 C307 296 317 172 333 68 Z"
    fill="#1B5FAB"
  />
  <path
    d="M401 38 C442 146 456 266 436 338 C427 370 390 384 362 362 C374 292 384 150 401 38 Z"
    fill="#3B3288"
  />
</svg>
